name: CI

on:
  push:
    branches: ["main", "prototype/**"]
  pull_request:

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo check
        run: cargo check --workspace
      - name: Cargo test
        run: cargo test --workspace
      - name: Build host
        run: cargo build --release -p skyrim-skate-host
      - name: Upload host prototype
        uses: actions/upload-artifact@v4
        with:
          name: SkyrimSkateHost
          path: target/release/skyrim-skate-host.exe
          if-no-files-found: error
