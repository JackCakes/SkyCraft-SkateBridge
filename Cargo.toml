[workspace]
resolver = "2"
exclude = ["third_party/iw4l-skate/skate"]
members = [
    "crates/protocol",
    "crates/geometry",
    "crates/session-api",
    "crates/real-session-adapter",
    "crates/pinned-skate-host",
    "crates/fake-skyrim",
    "crates/host",
]

[workspace.package]
edition = "2024"
version = "0.0.1"

[workspace.dependencies]
skycraft-skate-protocol = { path = "crates/protocol" }
skycraft-skate-geometry = { path = "crates/geometry" }
skycraft-skate-session-api = { path = "crates/session-api" }
skycraft-skate-real-session = { path = "crates/real-session-adapter" }
