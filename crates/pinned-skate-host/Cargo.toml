[package]
name = "skate-host-skycraft-pin"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "../../third_party/iw4l-skate/skate/crates/skate-host/src/lib.rs"

[dependencies]
bevy = { version = "0.19", default-features = false, features = ["std", "multi_threaded", "bevy_log"] }
