skate-data = { path = "../../third_party/iw4l-skate/skate/crates/skate-data" }
skate-net = { path = "../../third_party/iw4l-skate/skate/crates/skate-net" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
half = "2.7.1"
